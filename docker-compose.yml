services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:4.4}
    container_name: yottaflex-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || mongo --quiet --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: yottaflex-app
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: yottaflex
      PORT: 3000
      NODE_ENV: production
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
